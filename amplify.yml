version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - corepack enable
            - corepack prepare pnpm@11.3.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -e NEXT_PUBLIC_ >> .env.production || true
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
